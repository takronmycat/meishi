        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l0.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l0.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><circle cx="12" cy="13" r="3"/></svg>
        手動で撮影する
      </button>
    </footer>

    <!-- 撮影画像確認・保存モーダル -->
    <div id="resultModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-300">
      <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-sm w-full p-5 text-center shadow-2xl flex flex-col items-center">
        <div class="w-10 h-10 rounded-full bg-blue-500/20 text-blue-400 flex items-center justify-center mb-3">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
        </div>
        <h3 class="text-lg font-bold text-white mb-1">この画像でよろしいですか？</h3>
        <p class="text-xs text-slate-400 mb-4">ブレや反射、文字の見切れがないかご確認ください</p>
        
        <!-- Preview of captured card -->
        <div class="w-full aspect-[1.6/1] bg-black rounded-lg overflow-hidden border border-slate-700 mb-4 shadow-md">
          <img id="previewImage" class="w-full h-full object-contain" alt="撮影された名刺">
        </div>

        <div class="w-full flex gap-2">
          <button onclick="retakePhoto()" class="flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl text-slate-200 border border-slate-600 transition flex items-center justify-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
            撮り直す
          </button>
          <button onclick="confirmAndSavePhoto()" class="flex-1 py-3 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl text-white shadow-lg transition flex items-center justify-center gap-1">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
            OK（保存する）
          </button>
        </div>
      </div>
    </div>

    <script>
      // ... existing code ...
      let isCapturing = false;
      let holdStartTime = null;
      let lastFrameData = null;
      let isDemoMode = false;
      let demoProgress = 0;
      let activeDemoCanvas = null; // デモキャンバス保持用
      let lastCapturedDataUrl = null;
      const HOLD_DURATION_MS = 1000;
      const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 48;

      // ... existing code ...
      function startDemoMode() {
        isDemoMode = true;
        cameraLoading.classList.add('hidden');
        statusMessage.textContent = '【デモモード】名刺が近づいて自動撮影されます';
        
        // 仮想キャンバスで名刺が近づく映像をシミュレーション
        const demoCanvas = document.createElement('canvas');
        demoCanvas.width = 640;
        demoCanvas.height = 480;
        activeDemoCanvas = demoCanvas;
        const dCtx = demoCanvas.getContext('2d');

        function renderDemo() {
          if (isCapturing) return;
          
          // 背景（暗い卓上）
          dCtx.fillStyle = '#1e293b';
          dCtx.fillRect(0, 0, 640, 480);

          demoProgress += 0.015;
          const cycle = Math.sin(demoProgress); // 0〜1を往復

          // サイクル後半で名刺が中央枠内に収まって静止するシミュレーション
          if (cycle > 0.3) {
            // 白い名刺を描画
            dCtx.fillStyle = '#ffffff';
            dCtx.shadowColor = 'rgba(0,0,0,0.5)';
            dCtx.shadowBlur = 15;
            dCtx.fillRect(160, 140, 320, 200);
            
            // 名刺上のテキストデザイン
            dCtx.shadowBlur = 0;
            dCtx.fillStyle = '#0f172a';
            dCtx.font = 'bold 18px sans-serif';
            dCtx.fillText('株式会社 テクノロジー', 190, 180);
            dCtx.font = '14px sans-serif';
            dCtx.fillText('山田 太郎 様', 190, 220);
            dCtx.fillStyle = '#64748b';
            dCtx.fillText('代表取締役CEO', 190, 245);
          }

          // 判定へ引き渡し
          analyzeGuideFromCanvas(demoCanvas);
      // 5. シャッター撮影処理 (確認用プレビュー表示)
      function takePhoto() {
        if (isCapturing) return;
        isCapturing = true;

        playShutterSound();

        // 画面フラッシュエフェクト
        const flash = document.createElement('div');
        flash.className = 'fixed inset-0 bg-white z-50 transition-opacity duration-300';
        document.body.appendChild(flash);
        setTimeout(() => flash.style.opacity = '0', 50);
        setTimeout(() => flash.remove(), 350);

        statusMessage.textContent = '撮影完了！画像をご確認ください';

        // カメラまたはデモ映像から画像キャプチャを生成
        const saveCanvas = document.createElement('canvas');
        const source = isDemoMode ? activeDemoCanvas : video;
        
        saveCanvas.width = source.videoWidth || source.width || 640;
        saveCanvas.height = source.videoHeight || source.height || 480;
        
        const saveCtx = saveCanvas.getContext('2d');
        saveCtx.drawImage(source, 0, 0, saveCanvas.width, saveCanvas.height);

        // 画像データの抽出 (JPEG形式)
        lastCapturedDataUrl = saveCanvas.toDataURL('image/jpeg', 0.92);

        // ※いきなり保存はせず、確認プレビューモーダルを表示
        setTimeout(() => {
          showResultModal(lastCapturedDataUrl);
        }, 300);
      }

      // ドライブ/ローカルへファイル出力（保存）
      function saveImageToDrive(dataUrl) {
        const dateStr = new Date().toISOString().replace(/[:.-]/g, "").slice(0, 15);
        const fileName = `名刺_${dateStr}.jpg`;

        // aタグを生成して自動クリックし、保存フォルダ（ドライブ）へ保存
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // ブラウザのローカルストレージにも最新履歴として保存
        try {
          localStorage.setItem('last_scanned_card', dataUrl);
        } catch(e) {}
      }

      // 撮影完了確認モーダル表示
      function showResultModal(dataUrl) {
        const modal = document.getElementById('resultModal');
        const previewImg = document.getElementById('previewImage');

        previewImg.src = dataUrl;

        modal.classList.remove('hidden');
        setTimeout(() => {
          modal.classList.remove('opacity-0');
        }, 10);
      }

      // 「OK（保存する）」が押されたときの処理
      function confirmAndSavePhoto() {
        if (lastCapturedDataUrl) {
          saveImageToDrive(lastCapturedDataUrl);
        }
        closeResultModal();
      }

      // 「撮り直す」が押されたときの処理
      function retakePhoto() {
        closeResultModal();
      }

      // モーダルを閉じて次の受付・撮影待機へ
      function closeResultModal() {
        const modal = document.getElementById('resultModal');
        modal.classList.add('opacity-0');
        setTimeout(() => {
          modal.classList.add('hidden');
          isCapturing = false;
          holdStartTime = null;
          countdownOverlay.classList.add('opacity-0');
          statusMessage.textContent = isDemoMode ? '【デモモード】名刺が近づいて自動撮影されます' : '名刺を枠内にかざしてください';
          statusMessage.className = "text-sm text-slate-400 mt-1";
        }, 300);
      }

      function playShutterSound() {
        try {
          const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(880, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        } catch (e) {}
      }

      window.onload = initCamera;
    </script>
