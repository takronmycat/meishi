<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>来校者受付</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 24px;
    }

    .card {
      background: #1e293b;
      border-radius: 16px;
      padding: 24px 32px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid #334155;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      margin: 0 0 20px 0;
      color: #f1f5f9;
      letter-spacing: 0.05em;
    }

    /* 画面切り替え制御 */
    .view { display: none; }
    .view.active { display: block; }

    /* ボタン共通 */
    .btn-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .btn {
      padding: 14px 28px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      background: #2563eb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-width: 160px;
    }
    .btn:hover { background: #1d4ed8; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #475569; }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-control {
      padding: 8px 16px;
      font-size: 14px;
      min-width: auto;
      background: #334155;
    }

    /* カメラ設定エリア */
    .camera-select-bar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
      background: #0f172a;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .camera-select-bar label {
      font-size: 14px;
      color: #94a3b8;
      font-weight: 600;
    }
    select.camera-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      max-width: 280px;
    }

    /* ビデオプレビューコンテナ（iPad横長最適化） */
    .viewport-container {
      position: relative;
      width: 100%;
      max-width: 680px;
      height: 380px;
      margin: 0 auto;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video#videoArea {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 名刺撮影用ガイド枠（横向き 1.6 : 1） */
    .card-guide {
      position: absolute;
      width: 320px;
      height: 200px;
      border: 3px dashed #38bdf8;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
      pointer-events: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-guide.detected {
      border-color: #22c55e;
      border-style: solid;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.4), 0 0 20px rgba(34, 197, 94, 0.6);
    }
    .guide-text {
      color: rgba(255, 255, 255, 0.85);
      font-size: 14px;
      font-weight: bold;
      background: rgba(15, 23, 42, 0.75);
      padding: 6px 14px;
      border-radius: 20px;
    }

    /* プログレスバー */
    .progress-bar-container {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 240px;
      height: 8px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      overflow: hidden;
      display: none;
    }
    .progress-bar-fill {
      width: 0%;
      height: 100%;
      background: #22c55e;
      transition: width 0.1s linear;
    }

    /* プレビュー画像表示 */
    #previewImg {
      max-width: 100%;
      max-height: 380px;
      border-radius: 8px;
      border: 1px solid #475569;
    }

    /* 受付完了 */
    .receipt-box {
      background: #064e3b;
      border: 2px dashed #10b981;
      padding: 24px;
      border-radius: 12px;
      margin: 20px 0;
    }
    .receipt-number {
      font-size: 40px;
      font-weight: bold;
      color: #34d399;
      letter-spacing: 4px;
      margin: 10px 0;
    }

    .loading-msg {
      font-size: 16px;
      color: #38bdf8;
      font-weight: bold;
      margin: 16px 0;
    }

    .error-msg {
      color: #ef4444;
      font-size: 14px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- 1. トップ画面 -->
    <div id="view-home" class="view active">
      <h1>来校受付</h1>
      <p style="margin-bottom: 28px; font-size: 18px; color: #94a3b8;">名刺をお持ちですか？</p>
      <div class="btn-group">
        <button class="btn" onclick="startCamera()">名刺をスキャンする</button>
      </div>
    </div>

    <!-- 2. カメラ撮影画面（iPad横向き最適化） -->
    <div id="view-camera" class="view">
      <h1>枠内に名刺を合わせてください</h1>
      
      <!-- カメラ切り替えバー -->
      <div class="camera-select-bar">
        <label for="cameraSelect">カメラ:</label>
        <select id="cameraSelect" class="camera-select" onchange="onCameraChange()">
          <option value="">カメラを検出中...</option>
        </select>
        <button class="btn btn-control" onclick="switchCameraFacing()">📷 反転</button>
      </div>

      <div class="viewport-container">
        <video id="videoArea" autoplay playsinline muted></video>
        <div id="cardGuide" class="card-guide">
          <span class="guide-text" id="guideText">名刺をここに配置</span>
        </div>
        <div id="progressContainer" class="progress-bar-container">
          <div id="progressFill" class="progress-bar-fill"></div>
        </div>
      </div>

      <div class="btn-group">
        <button class="btn btn-success" onclick="takePhoto()">手動撮影</button>
        <button class="btn btn-secondary" onclick="stopCamera(); showView('view-home');">戻る</button>
      </div>
    </div>

    <!-- 3. 確認画面 -->
    <div id="view-preview" class="view">
      <h1>この画像で受付しますか？</h1>
      <div style="margin: 16px 0;">
        <img id="previewImg" src="" alt="撮影プレビュー">
      </div>
      
      <div id="loadingMsg" class="loading-msg" style="display: none;">送信中...そのままお待ちください</div>
      <div id="errorMsg" class="error-msg" style="display: none;"></div>

      <div id="actionButtons" class="btn-group">
        <button class="btn btn-success" onclick="submitData()">受付する</button>
        <button class="btn btn-secondary" onclick="retakePhoto()">撮り直す</button>
      </div>
    </div>

    <!-- 4. 完了画面 -->
    <div id="view-success" class="view">
      <h1>受付完了</h1>
      <p style="color: #94a3b8;">以下の番号で受付いたしました。</p>
      <div class="receipt-box">
        <div style="font-size: 14px; color: #a7f3d0;">受付番号</div>
        <div class="receipt-number" id="displayReceipt">000000</div>
      </div>
      <p style="color: #cbd5e1; line-height: 1.6;">ありがとうございました。<br>担当者が参りますのでお待ちください。</p>
      <div class="btn-group">
        <button class="btn" onclick="location.reload()">最初の画面に戻る</button>
      </div>
    </div>

  </div>
</div>

<!-- 画像処理用Canvas（非表示） -->
<canvas id="canvas" style="display:none;"></canvas>
<canvas id="analysisCanvas" style="display:none;"></canvas>

<script>
  // GAS WebアプリURL（GAS実行環境外で使用する場合に指定）
  const GAS_URL = "";

  let videoStream = null;
  let capturedBase64 = "";
  let currentDeviceId = null;
  let currentFacingMode = "environment"; // デフォルトは背面
  let autoCaptureProgress = 0;
  let isAnalyzing = false;

  // 画面切り替え
  function showView(viewId) {
    document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
    document.getElementById(viewId).classList.add('active');
  }

  // カメラ一覧を取得してドロップダウンを更新
  async function updateCameraList() {
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const videoDevices = devices.filter(d => d.kind === 'videoinput');
      const select = document.getElementById('cameraSelect');
      select.innerHTML = '';

      if (videoDevices.length === 0) {
        select.innerHTML = '<option value="">カメラが見つかりません</option>';
        return;
      }

      videoDevices.forEach((device, index) => {
        const option = document.createElement('option');
        option.value = device.deviceId;
        option.text = device.label || `カメラ ${index + 1}`;
        if (device.deviceId === currentDeviceId) {
          option.selected = true;
        }
        select.appendChild(option);
      });
    } catch (err) {
      console.warn("カメラリストの取得に失敗:", err);
    }
  }

  // カメラ起動処理
  async function startCamera(deviceId = null) {
    showView('view-camera');
    stopCamera();

    const video = document.getElementById('videoArea');
    
    // カメラ制約設定
    let constraints = {
      video: {
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    };

    if (deviceId) {
      constraints.video.deviceId = { exact: deviceId };
    } else {
      constraints.video.facingMode = { ideal: currentFacingMode };
    }

    try {
      videoStream = await navigator.mediaDevices.getUserMedia(constraints);
      video.srcObject = videoStream;

      // 現在使用中のトラックからIDを取得
      const track = videoStream.getVideoTracks()[0];
      if (track) {
        const settings = track.getSettings();
        currentDeviceId = settings.deviceId || null;
      }

      await updateCameraList();
      startAutoScan();

    } catch (err) {
      console.warn("指定条件でのカメラ起動失敗。フォールバックを実行:", err);
      // フォールバック: 条件なしで起動試行
      try {
        videoStream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = videoStream;
        await updateCameraList();
        startAutoScan();
      } catch (e) {
        showErrorMessage("カメラの起動に失敗しました。アクセス許可をご確認ください。");
        showView('view-home');
      }
    }
  }

  // カメラ停止
  function stopCamera() {
    stopAutoScan();
    if (videoStream) {
      videoStream.getTracks().forEach(track => track.stop());
      videoStream = null;
    }
  }

  // カメラ変更イベント（ドロップダウン選択）
  function onCameraChange() {
    const select = document.getElementById('cameraSelect');
    const deviceId = select.value;
    if (deviceId) {
      currentDeviceId = deviceId;
      startCamera(deviceId);
    }
  }

  // カメラ反転ボタン（インカメラ / アウトカメラ切り替え）
  function switchCameraFacing() {
    currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
    currentDeviceId = null;
    startCamera();
  }

  // 自動スキャン解析ループ
  function startAutoScan() {
    isAnalyzing = true;
    autoCaptureProgress = 0;
    requestAnimationFrame(analyzeFrame);
  }

  function stopAutoScan() {
    isAnalyzing = false;
    autoCaptureProgress = 0;
    updateProgressUI(0, false);
  }

  // フレーム解析（明度＆領域チェック）
  function analyzeFrame() {
    if (!isAnalyzing) return;

    const video = document.getElementById('videoArea');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      const canvas = document.getElementById('analysisCanvas');
      const ctx = canvas.getContext('2d');
      
      canvas.width = 160;
      canvas.height = 100;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const isCardDetected = detectCardInFrame(imageData);

      if (isCardDetected) {
        autoCaptureProgress += 4; // カウントアップ
        if (autoCaptureProgress >= 100) {
          autoCaptureProgress = 100;
          updateProgressUI(100, true);
          takePhoto(); // 自動シャッター実行
          return;
        }
        updateProgressUI(autoCaptureProgress, true);
      } else {
        autoCaptureProgress = Math.max(0, autoCaptureProgress - 8);
        updateProgressUI(autoCaptureProgress, false);
      }
    }

    if (isAnalyzing) {
      setTimeout(() => requestAnimationFrame(analyzeFrame), 60);
    }
  }

  // 名刺検出アルゴリズム（コントラスト & 明度判定）
  function detectCardInFrame(imageData) {
    const data = imageData.data;
    let totalLuminance = 0;
    let highContrastPixels = 0;

    for (let i = 0; i < data.length; i += 4) {
      const r = data[i];
      const g = data[i + 1];
      const b = data[i + 2];
      const lum = 0.299 * r + 0.587 * g + 0.114 * b;
      totalLuminance += lum;

      if (lum > 140) highContrastPixels++;
    }

    const avgLuminance = totalLuminance / (data.length / 4);
    const brightRatio = highContrastPixels / (data.length / 4);

    return (brightRatio > 0.35 && avgLuminance > 90);
  }

  // プログレスバーUI更新
  function updateProgressUI(progress, detected) {
    const guide = document.getElementById('cardGuide');
    const guideText = document.getElementById('guideText');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');

    if (detected) {
      guide.classList.add('detected');
      guideText.innerText = "そのまま動かさないでください";
      progressContainer.style.display = 'block';
      progressFill.style.width = `${progress}%`;
    } else {
      guide.classList.remove('detected');
      guideText.innerText = "名刺をここに配置";
      progressContainer.style.display = 'none';
      progressFill.style.width = '0%';
    }
  }

  // 撮影処理
  function takePhoto() {
    stopAutoScan();
    const video = document.getElementById('videoArea');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const MAX_WIDTH = 1280;
    let width = video.videoWidth || 1280;
    let height = video.videoHeight || 720;
    
    if (width > MAX_WIDTH) {
      height = Math.floor(height * (MAX_WIDTH / width));
      width = MAX_WIDTH;
    }

    canvas.width = width;
    canvas.height = height;
    ctx.drawImage(video, 0, 0, width, height);

    capturedBase64 = canvas.toDataURL("image/jpeg", 0.8);
    document.getElementById('previewImg').src = capturedBase64;
    
    stopCamera();
    hideErrorMessage();
    showView('view-preview');
  }

  // 撮り直し
  function retakePhoto() {
    capturedBase64 = "";
    hideErrorMessage();
    startCamera(currentDeviceId);
  }

  // エラー表示コントロール
  function showErrorMessage(msg) {
    const el = document.getElementById('errorMsg');
    el.innerText = msg;
    el.style.display = 'block';
  }

  function hideErrorMessage() {
    const el = document.getElementById('errorMsg');
    el.innerText = '';
    el.style.display = 'none';
  }

  // 送信処理（GASへ保存）
  function submitData() {
    if (!capturedBase64) return;

    hideErrorMessage();
    document.getElementById('actionButtons').style.display = 'none';
    document.getElementById('loadingMsg').style.display = 'block';

    // A. GAS環境内（google.script.run）での保存実行
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(result => {
          if (result && result.success) {
            document.getElementById('displayReceipt').innerText = result.receiptNumber || '000000';
            showView('view-success');
          } else {
            showErrorMessage("保存エラー: " + ((result && result.error) || '処理に失敗しました'));
            resetSubmitUI();
          }
        })
        .withFailureHandler(err => {
          showErrorMessage("通信エラーが発生しました: " + err.message);
          resetSubmitUI();
        })
        .saveRecord(capturedBase64);
      return;
    }

    // B. 外部Web（GitHub Pages等）からのHTTP POST送信
    if (GAS_URL) {
      fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify({ image: capturedBase64 }),
        headers: { "Content-Type": "text/plain" }
      })
      .then(res => res.json())
      .then(result => {
        if (result.success) {
          document.getElementById('displayReceipt').innerText = result.receiptNumber;
          showView('view-success');
        } else {
          throw new Error(result.error);
        }
      })
      .catch(error => {
        showErrorMessage("送信エラー: " + error.message);
        resetSubmitUI();
      });
      return;
    }

    showErrorMessage("保存先(GAS)が定義されていません。");
    resetSubmitUI();
  }

  function resetSubmitUI() {
    document.getElementById('actionButtons').style.display = 'flex';
    document.getElementById('loadingMsg').style.display = 'none';
  }
</script>

</body>
</html>
